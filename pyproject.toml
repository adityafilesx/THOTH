[project]
name = "thoth-workspace"
version = "0.1.0"
description = "THOTH monorepo root — tooling configuration only (daemon lives in apps/daemon)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/daemon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/daemon/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S101",   # assert allowed (pytest)
  "UP046",  # Generic[T] subclassing is intentional for the tool base class
]

[tool.ruff.lint.per-file-ignores]
"apps/daemon/tests/**" = ["S", "ASYNC"]
# Verification probes intentionally shell out to `ps`/`git` with fixed argv
# (shell=False, no untrusted input) for read-only state probes.
"apps/daemon/src/thoth_daemon/core/verifiers/context.py" = ["S603", "S607"]
# Capstone CLI sets up its own git fixture workspace with fixed argv.
"apps/daemon/src/thoth_daemon/evals/run_capstones.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/daemon/src"
packages = ["thoth_daemon"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/daemon/tests"]
