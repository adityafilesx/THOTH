[project]
name = "omnimac-daemon"
version = "0.1.0"
description = "OmniMac local daemon — agent core and safety engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # macOS app control (slice 6). macOS-only; imported lazily so non-darwin
    # (e.g. CI) never touches AppKit.
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    # Semantic AX inspection/action and the TCC trust probe (Phase 5.4).
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    # Browser adapter (slice 7). Browser binaries install separately via
    # `playwright install chromium`; imported lazily.
    "playwright>=1.47",
    # Real planner (slice 8) — Anthropic Messages API for a planning-only call.
    # Imported lazily; needs ANTHROPIC_API_KEY only when planner="claude".
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.21,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnimac_daemon"]
