[project]
name = "thoth-daemon"
version = "0.1.0"
description = "THOTH local daemon — agent core and safety engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # macOS app control (slice 6). macOS-only; imported lazily so non-darwin
    # (e.g. CI) never touches AppKit.
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth_daemon"]
